# SaaS TLS reverse proxy
# Place cert.pem + key.pem in nginx/certs/ (see docs/setup_saas.md)

upstream ui {
    server frontend:80;
}

upstream api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ingest {
        proxy_pass http://api/ingest;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
