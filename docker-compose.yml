services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logmgr
      POSTGRES_PASSWORD: logmgr
      POSTGRES_DB: logmgr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logmgr -d logmgr"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://logmgr:logmgr@db:5432/logmgr
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      CORS_ORIGINS: "*"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
      VIEWER_USERNAME: ${VIEWER_USERNAME:-viewer}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-password}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingest:
    build: ./ingest
    environment:
      BACKEND_URL: http://backend:8000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
      SYSLOG_PORT: "514"
      DEFAULT_TENANT: demoA
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "514:514/udp"
    # If host cannot bind 514, change to "5514:514/udp"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    depends_on:
      - backend
    ports:
      - "3080:80"

  # Optional HTTPS reverse proxy for SaaS mode
  proxy:
    image: nginx:1.27-alpine
    profiles: ["saas"]
    volumes:
      - ./nginx/saas.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
